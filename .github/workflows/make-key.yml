name: Create signing key

# One-time, manual. Creates the permanent signing key of this app and stores it as repository secrets.
# Needs the secret KEYS_TOKEN (fine-grained token, Secrets: read and write, this repository).
# It never overwrites an existing key: replacing it would stop updates over installed apps.
on:
  workflow_dispatch:

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - name: Create and store the key
        env:
          GH_TOKEN: ${{ secrets.KEYS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Add the repository secret KEYS_TOKEN first"; exit 1; fi
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^ANDROID_KEYSTORE_B64'; then
            echo "The signing key already exists. Nothing changed."; exit 0
          fi
          pw=$(openssl rand -hex 16)
          echo "::add-mask::$pw"
          keytool -genkeypair -keystore key.jks -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 \
            -validity 10950 -storepass "$pw" -keypass "$pw" -dname "CN=${GITHUB_REPOSITORY#*/}, O=somon101, C=TJ"
          base64 -w0 key.jks | gh secret set ANDROID_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY"
          printf '%s' "$pw" | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf '%s' "$pw" | gh secret set ANDROID_KEY_PASSWORD --repo "$GITHUB_REPOSITORY"
          printf '%s' upload | gh secret set ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY"
          rm key.jks
          echo "Done: the signing key is stored in the repository secrets."
